<div class="glass-effect rounded-3xl p-8 mb-8 card-hover">
  <div class="flex items-center justify-center mb-6">
    <div class="w-12 h-12 rounded-full bg-gradient-to-r from-teal-500 to-blue-600 flex items-center justify-center mr-4">
      <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
      </svg>
    </div>
    <h2 class="font-serif text-3xl font-semibold text-white">Generate Knowledge Test</h2>
  </div>
  
  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
    <div class="space-y-3">
      <label class="block text-sm font-medium text-white/90 mb-2">
        <span class="flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
          Subject Area
        </span>
      </label>
      <input 
        type="text" 
        [(ngModel)]="topic" 
        placeholder="Philosophy, Psychology, Ethics..."
        class="form-input w-full px-4 py-3 rounded-xl text-gray-800 placeholder-gray-500 font-medium">
      <p class="text-xs text-white/60 mt-1">Enter your area of study</p>
    </div>

    <div class="space-y-3">
      <label class="block text-sm font-medium text-white/90 mb-2">
        <span class="flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
          </svg>
          Book (Optional)
        </span>
      </label>
      <input 
        type="text" 
        [(ngModel)]="book" 
        placeholder="Nicomachean Ethics, Republic..."
        class="form-input w-full px-4 py-3 rounded-xl text-gray-800 placeholder-gray-500 font-medium">
      <p class="text-xs text-white/60 mt-1">Focus on specific book</p>
    </div>

    <div class="space-y-3">
      <label class="block text-sm font-medium text-white/90 mb-2">
        <span class="flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          Question Type
        </span>
      </label>
      <select 
        [(ngModel)]="questionType"
        class="form-input w-full px-4 py-3 rounded-xl text-gray-800 font-medium">
        <option value="Basic">Basic Concepts</option>
        <option value="Situational">Real-world Scenarios</option>
      </select>
      <p class="text-xs text-white/60 mt-1">Type of questions</p>
    </div>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
    <div class="space-y-3">
      <label class="block text-sm font-medium text-white/90 mb-2">
        <span class="flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
          </svg>
          Complexity Level
        </span>
      </label>
      <select 
        [(ngModel)]="difficulty"
        class="form-input w-full px-4 py-3 rounded-xl text-gray-800 font-medium">
        <option value="Easy">Foundational</option>
        <option value="Medium">Intermediate</option>
        <option value="Hard">Advanced</option>
      </select>
      <p class="text-xs text-white/60 mt-1">Select difficulty level</p>
    </div>
    
    <div class="space-y-3">
      <label class="block text-sm font-medium text-white/90 mb-2">
        <span class="flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"></path>
          </svg>
          Question Count
        </span>
      </label>
      <input 
        type="number" 
        [(ngModel)]="questionCount" 
        min="1" 
        max="10"
        class="form-input w-full px-4 py-3 rounded-xl text-gray-800 font-medium">
      <p class="text-xs text-white/60 mt-1">Number of questions to generate</p>
    </div>

    <div class="space-y-3">
      <label class="block text-sm font-medium text-white/90 mb-2">
        <span class="flex items-center">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
          </svg>
          Language
        </span>
      </label>
      <select 
        [(ngModel)]="language"
        class="form-input w-full px-4 py-3 rounded-xl text-gray-800 font-medium">
        <option value="Polish">Polish</option>
        <option value="English">English</option>
      </select>
      <p class="text-xs text-white/60 mt-1">Question language</p>
    </div>
  </div>
  
  <div class="text-center">
    <button 
      (click)="onGenerateQuiz()" 
      [disabled]="loading || !topic.trim()"
      class="btn-primary px-8 py-4 rounded-2xl text-lg font-medium inline-flex items-center space-x-3 transition-all duration-300">
      <svg *ngIf="!loading" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
      </svg>
      <svg *ngIf="loading" class="animate-spin w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
      </svg>
      <span>{{ loading ? 'Generating Quiz...' : 'Create Quiz' }}</span>
    </button>
  </div>
</div>
