<div class="bg-white rounded-lg shadow-md p-6 mb-8">
  <h2 class="text-2xl font-semibold text-gray-700 mb-6">Generate a Quiz</h2>
  
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Topic:</label>
      <input 
        type="text" 
        [(ngModel)]="topic" 
        placeholder="Enter a topic (e.g., JavaScript, History)"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Difficulty:</label>
      <select 
        [(ngModel)]="difficulty"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Number of Questions:</label>
      <input 
        type="number" 
        [(ngModel)]="questionCount" 
        min="1" 
        max="10"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
    </div>
  </div>
  
  <button 
    (click)="onGenerateQuiz()" 
    [disabled]="loading || !topic.trim()"
    class="w-full md:w-auto px-6 py-3 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 disabled:bg-gray-400 disabled:cursor-not-allowed transition-colors">
    {{ loading ? 'Generating...' : 'Generate Quiz' }}
  </button>
</div>
