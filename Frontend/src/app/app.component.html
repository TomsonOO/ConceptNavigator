<div class="min-h-screen relative overflow-hidden">
  <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-gray-900 to-slate-800"></div>
  
  <div class="absolute inset-0 opacity-10">
    <svg class="w-full h-full" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs>
        <pattern id="philosophical-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="10" cy="10" r="1" fill="white" opacity="0.1"/>
        </pattern>
      </defs>
      <rect width="100" height="100" fill="url(#philosophical-pattern)"/>
    </svg>
  </div>

  <div class="relative z-10 py-8 px-4">
    <div class="max-w-6xl mx-auto">
      <header class="text-center mb-12">
        <div class="glass-effect rounded-3xl p-8 mb-8 card-hover">
          <h1 class="font-serif text-5xl md:text-7xl font-bold gradient-text mb-4">
            ConceptNavigator
          </h1>
          <div class="w-24 h-1 bg-gradient-to-r from-teal-400 to-blue-500 mx-auto rounded-full"></div>
        </div>
      </header>

      <main class="space-y-8">
        <app-quiz-form (generateQuiz)="onGenerateQuiz($event)"></app-quiz-form>
        
        <div *ngIf="quiz" class="animate-fade-in">
          <app-quiz-display [quiz]="quiz"></app-quiz-display>
        </div>
      </main>
    </div>
  </div>
</div>
